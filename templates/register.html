{% extends "base.html" %}

{% block title %}Create Commuter Account{% endblock %}
{% block breadcrumb %}Register{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <img src="{{ url_for('static', filename='terminal_hub_logo.png') }}" alt="Malolos City Terminal Hub Logo" class="auth-logo">
    <h2 class="auth-title">Create Account</h2>
    <p class="auth-subtitle">Join commuters contributing to fare transparency</p>

    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="Choose a username" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Enter a secure password" required autocomplete="new-password">
      </div>

      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required autocomplete="new-password">
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px;">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        <span>Create Account</span>
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('login') }}">Log in here</a>
    </div>
  </div>
</div>
{% endblock %}
